[package]
name = "rudim"
version = "3.0.5"
edition = "2024"

[dependencies]
bulletformat = "1.8.0"
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "d372d487aedfeb8bdc256b9f694dbcd41016bf82", package = "bullet_lib", optional = true }


[features]
default = []
train = ["dep:bullet_lib"]
cuda = ["train", "bullet_lib/cuda"]
rocm = ["train", "bullet_lib/rocm"]

[profile.dev]
debug = true
debug-assertions = true

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
